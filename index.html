<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Witching Hour</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120819; }
      /* Картинка 16:9 по центру, по краям полосы цвета фона */
      #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #120819; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(320px, 60vw); text-align: center; font-family: sans-serif; color: #9A8EAD; font-size: 14px; letter-spacing: 0.08em; }
      #bar { margin-top: 10px; height: 6px; border-radius: 3px; background: #2A2236; overflow: hidden; }
      #fill { height: 100%; width: 0%; background: #D8C297; border-radius: 3px; transition: width 0.15s; }
      #error { display: none; position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; color: #D98A82; font-family: sans-serif; font-size: 14px; padding: 0 16px; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading">ЗАГРУЗКА<div id="bar"><div id="fill"></div></div></div>
    <div id="error"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var config = {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "xdariko",
        productName: "Witching Hour",
        productVersion: "1.0",
        showBanner: function (msg, type) {
          if (type !== "error") { console.warn(msg); return; }
          var e = document.querySelector("#error");
          e.textContent = msg;
          e.style.display = "block";
        },
      };

      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          // Клик по игре сразу даёт фокус клавиатуре (Esc, пробел)
          canvas.focus();
        }).catch(function (message) {
          config.showBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
